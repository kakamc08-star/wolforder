<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تسجيل الدخول إلى نظام WolfOrder لإدارة الطلبات والتوصيل">
  <title>تسجيل الدخول | WolfOrder</title>
  <link rel="preload" href="images/wolf-login-bg-delivery.png" as="image">
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WolfOrder">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <meta name="theme-color" content="#06101f">
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-box" aria-labelledby="loginTitle">
      <header class="login-brand">
        <div class="brand-mark">
          <img src="icons/icon-192x192.png" alt="شعار WolfOrder" width="82" height="82">
        </div>
        <p class="brand-name" lang="en">WOLFORDER</p>
        <h1 id="loginTitle">تسجيل الدخول</h1>
        <p class="login-subtitle">أدخل بياناتك للانتقال إلى لوحة التحكم</p>
      </header>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"></path>
            </svg>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="أدخل اسم المستخدم"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 10V7a5 5 0 0 1 10 0v3M6 10h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"></path>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="أدخل كلمة المرور"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="إظهار كلمة المرور"
              aria-pressed="false"
            >
              <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 3 18 18M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 5.2A11.7 11.7 0 0 1 12 5c6.5 0 10 7 10 7a16.5 16.5 0 0 1-2.1 2.9M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.4 4-.9"></path>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginButton" class="login-submit">
          <span class="button-label">دخول</span>
          <span class="button-loader" aria-hidden="true"></span>
        </button>

        <div id="loginMessage" class="login-message" role="status" aria-live="polite" hidden>
          <span class="message-icon" aria-hidden="true"></span>
          <span class="message-text"></span>
        </div>
      </form>

      <footer class="login-security">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 5 6v5c0 4.8 2.8 8.2 7 10 4.2-1.8 7-5.2 7-10V6l-7-3Z"></path>
          <path d="m9.5 12 1.7 1.7 3.6-3.7"></path>
        </svg>
        <span>دخول آمن ومخصص لمستخدمي WolfOrder</span>
      </footer>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
