<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="إنشاء طلب Instagram سريع وآمن">
  <title>طلب Instagram | WolfOrder</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/instagram.css">
  <meta name="theme-color" content="#4c1d95">
</head>
<body class="storefront-page">
  <main class="storefront-shell">
    <div id="storefrontLoading" class="storefront-loading">جاري تحميل نموذج الطلب...</div>
    <section id="storefrontApp" hidden>
      <header class="storefront-header">
        <div class="storefront-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg></div>
        <h1 id="storefrontCompanyName">طلب Instagram</h1>
        <p>أدخل بياناتك واختر المنتجات المتوفرة</p>
      </header>

      <form id="instagramCustomerOrderForm" novalidate>
        <section class="storefront-card">
          <h2>بيانات الزبون</h2>
          <div class="storefront-grid">
            <div class="storefront-field"><label for="customerName">الاسم *</label><input id="customerName" autocomplete="name" required></div>
            <div class="storefront-field"><label for="customerNumber">رقم الموبايل *</label><input id="customerNumber" type="tel" inputmode="tel" autocomplete="tel" required></div>
            <div class="storefront-field full"><label for="customerAddress">العنوان *</label><textarea id="customerAddress" rows="2" autocomplete="street-address" required></textarea></div>
          </div>
        </section>

        <section class="storefront-card">
          <h2>نوع الطلب</h2>
          <div class="order-kind-grid">
            <label class="order-kind"><input type="radio" name="orderType" value="توصيل" checked><span>توصيل</span></label>
            <label class="order-kind"><input type="radio" name="orderType" value="شحن"><span>شحن</span></label>
          </div>
        </section>

        <section class="storefront-card">
          <h2>الأصناف</h2>
          <p>يمكنك اختيار أكثر من صنف ضمن نفس الطلب.</p>
          <div id="storefrontItems"></div>
          <button class="storefront-add" id="addStorefrontItem" type="button">+ إضافة صنف آخر</button>
        </section>

        <section class="storefront-card">
          <div class="storefront-field"><label for="customerNote">ملاحظة (اختياري)</label><textarea id="customerNote" rows="2"></textarea></div>
          <div class="storefront-total"><span>إجمالي سعر الطلب بالكامل</span><strong id="storefrontTotal">0</strong></div>
          <div id="storefrontMessage" aria-live="polite"></div>
          <button class="storefront-submit" id="confirmInstagramOrder" type="submit">تأكيد الطلب</button>
        </section>
      </form>
    </section>

    <section id="storefrontSuccess" class="storefront-card storefront-success" hidden>
      <div class="success-heart">❤️</div>
      <h2 id="storefrontSuccessTitle"></h2>
      <p>تم استلام طلبك بنجاح، وسيتم التواصل معك لمتابعة الطلب.</p>
    </section>
  </main>
  <script src="/js/instagram-order.js"></script>
</body>
</html>
