<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="تسجيل دخول حساب مشاهدة طلبات إنستغرام">
  <title>دخول مشاهدة إنستغرام | WolfOrder</title>
  <link rel="stylesheet" href="/css/style.css?v=20260901.1"><link rel="stylesheet" href="/css/instagram.css?v=20260903.1">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WolfOrder">
  <meta name="application-name" content="WolfOrder">
  <meta name="theme-color" content="#06101f">
  <script src="/js/pwa.js?v=20260908.2" defer></script>
</head>
<body class="login-page instagram-login-page">
  <main class="login-container"><section class="login-box" aria-labelledby="loginTitle">
    <header class="login-brand"><div class="brand-mark"><img src="/icons/icon-192x192.png" alt="WolfOrder" width="82" height="82"></div><p class="brand-name">WOLFORDER · INSTAGRAM</p><h1 id="loginTitle">بوابة مشاهدة الطلبات</h1><p class="login-subtitle">دخول منفصل ومخصص لشركتك — مشاهدة فقط</p></header>
    <form id="instagramViewerLoginForm" class="login-form">
      <div class="form-group"><label for="viewerLoginUsername">اسم المستخدم</label><div class="login-input-wrap"><input id="viewerLoginUsername" autocomplete="username" required></div></div>
      <div class="form-group"><label for="viewerLoginPassword">كلمة المرور</label><div class="login-input-wrap"><input id="viewerLoginPassword" type="password" autocomplete="current-password" required></div></div>
      <button id="viewerLoginButton" class="login-submit" type="submit"><span class="button-label">دخول للمشاهدة</span><span class="button-loader"></span></button>
      <div id="viewerLoginMessage" class="login-message" role="status" hidden><span class="message-icon"></span><span class="message-text"></span></div>
    </form>
    <footer class="login-security"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v10H5z"></path></svg><span>هذا الحساب لا يسمح بالإضافة أو التعديل أو التصدير.</span></footer>
  </section></main>
  <script src="/js/instagram-auth.js?v=20260901.3"></script>
</body>
</html>
